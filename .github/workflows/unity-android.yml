name: Build Unity Project Android APK

on:
  workflow_dispatch:
    inputs:
      project-repository:
        description: GitHub owner/repository containing the Unity project
        required: true
        default: tpylman90-ctrl/Unity-project-
        type: string
      project-branch:
        description: Branch to build from
        required: true
        default: main
        type: string
      project-path:
        description: Path to the Unity project root inside that repository
        required: true
        default: .
        type: string
      unity-version:
        description: Exact Unity Editor version including its release suffix
        required: true
        default: 6000.3.27f2
        type: string
      build-method:
        description: Static Unity Editor build method
        required: true
        default: UnityViewingBuild.BuildAndroid
        type: string
      apk-path:
        description: APK output path relative to this workflow workspace
        required: true
        default: target-project/Builds/Android/Eclipse-Building-Inspector.apk
        type: string
      artifact-name:
        description: Name for the uploaded APK artifact
        required: true
        default: Eclipse-Building-Inspector-APK
        type: string
      publish-prerelease:
        description: Attach the APK to a test prerelease in this build repository
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: unity-android-${{ inputs.project-repository }}-${{ inputs.project-branch }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.project-repository }} for Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Verify this build repository's Unity license secrets
        shell: bash
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Add UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD to Settings > Secrets and variables > Actions in this build repository."
            exit 1
          fi
      - name: Check out the selected game repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project-repository }}
          ref: ${{ inputs.project-branch }}
          token: ${{ secrets.PROJECT_REPO_TOKEN || github.token }}
          path: target-project
          lfs: true
          persist-credentials: false
      - name: Check Unity project files
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        shell: bash
        run: |
          project_root="target-project/$PROJECT_PATH"
          if [[ ! -f "$project_root/Packages/manifest.json" || ! -f "$project_root/ProjectSettings/ProjectVersion.txt" ]]; then
            echo "::error::The selected repository/path does not contain a Unity project."
            exit 1
          fi
      - name: Generate Blender asset library when present
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
        shell: bash
        run: |
          project_root="target-project/$PROJECT_PATH"
          generator="$project_root/Blender/ViewingProject/generate_assets.py"
          if [[ -f "$generator" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y blender
            blender --background --factory-startup --python "$generator"
          fi
      - name: Cache selected project's Unity Library
        uses: actions/cache@v4
        with:
          path: target-project/${{ inputs.project-path }}/Library
          key: Unity-Library-${{ inputs.unity-version }}-Android-${{ hashFiles('target-project/**/Packages/manifest.json', 'target-project/**/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ inputs.unity-version }}-Android-
      - name: Build the selected project
        uses: game-ci/unity-builder@v6
        with:
          projectPath: target-project/${{ inputs.project-path }}
          unityVersion: ${{ inputs.unity-version }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildsPath: Builds
          buildMethod: ${{ inputs.build-method }}
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          cliVersion: v0.1.77
      - name: Confirm APK output
        env:
          APK_PATH: ${{ inputs.apk-path }}
        shell: bash
        run: |
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Expected APK was not produced at $APK_PATH"
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.apk-path }}
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish optional test APK prerelease
    if: ${{ inputs.publish-prerelease }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release-apk
      - name: Publish test APK in the build repository
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_REPOSITORY: ${{ inputs.project-repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          apk_path="$(find release-apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" || ! -s "$apk_path" ]]; then
            echo "::error::The downloaded artifact did not contain an APK."
            exit 1
          fi
          safe_project="${PROJECT_REPOSITORY//\//-}"
          safe_project="${safe_project//./-}"
          tag="unity-${safe_project}-${RUN_NUMBER}"
          gh release create "$tag" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Unity Android Test: $PROJECT_REPOSITORY #$RUN_NUMBER" \
            --notes "Development APK built from $PROJECT_REPOSITORY. This is a test artifact, not a production release." \
            --prerelease

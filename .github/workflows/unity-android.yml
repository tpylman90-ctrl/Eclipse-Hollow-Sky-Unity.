name: Reusable Unity Android Build

on:
  workflow_call:
    inputs:
      unity-version:
        description: Exact Unity Editor version, including revision suffix.
        required: true
        type: string
      project-path:
        description: Path to the Unity project root inside the caller repository.
        required: false
        default: .
        type: string
      build-method:
        description: Static Unity Editor build method, for example BuildScript.BuildAndroid.
        required: true
        type: string
      apk-path:
        description: Exact APK file path written by the project's build method.
        required: true
        type: string
      artifact-name:
        description: Name shown for the uploaded APK artifact.
        required: false
        default: Unity-Android-APK
        type: string
      publish-prerelease:
        description: Publish this build as a GitHub prerelease in the caller repository.
        required: false
        default: false
        type: boolean
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Unity Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check out the calling game repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Unity activation secrets before using runner time
        shell: bash
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD to the game repository's Actions secrets. See https://game.ci/docs/github/activation/."
            exit 1
          fi
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ inputs.project-path }}/Library
          key: Unity-Library-${{ inputs.unity-version }}-Android-${{ hashFiles(format('{0}/Packages/manifest.json', inputs.project-path), format('{0}/ProjectSettings/ProjectVersion.txt', inputs.project-path)) }}
          restore-keys: |
            Unity-Library-${{ inputs.unity-version }}-Android-
      - name: Build APK
        uses: game-ci/unity-builder@v6
        with:
          projectPath: ${{ inputs.project-path }}
          unityVersion: ${{ inputs.unity-version }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildsPath: build
          buildMethod: ${{ inputs.build-method }}
      - name: Confirm APK output
        env:
          APK_PATH: ${{ inputs.apk-path }}
        shell: bash
        run: |
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Expected APK was not produced at $APK_PATH"
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.apk-path }}
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish optional test prerelease
    if: ${{ inputs.publish-prerelease }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release-apk
      - name: Publish test prerelease to calling repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          apk_path="$(find release-apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" || ! -s "$apk_path" ]]; then
            echo "::error::The downloaded artifact did not contain an APK."
            exit 1
          fi
          tag="unity-android-test-$RUN_NUMBER"
          gh release create "$tag" "$apk_path" \
            --repo "$REPOSITORY" \
            --title "Unity Android Test #$RUN_NUMBER" \
            --notes "Test APK from workflow run $RUN_NUMBER. This is a development build, not a production release." \
            --prerelease

name: Unity Runner Source Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner and project split
        shell: bash
        run: |
          test -f .github/workflows/unity-android.yml
          test -f .github/workflows/build-project.yml
          grep -q "workflow_call:" .github/workflows/unity-android.yml
          grep -q "workflow_dispatch:" .github/workflows/build-project.yml
          grep -q "tpylman90-ctrl/Flight-unity" .github/workflows/build-project.yml
          grep -q "game-ci/unity-builder@v6" .github/workflows/build-project.yml
          grep -q "secrets.UNITY_LICENSE" .github/workflows/build-project.yml
          grep -q "actions/upload-artifact@v4" .github/workflows/build-project.yml
          grep -q "Flight-unity" README.md
          test ! -e Assets
          test ! -e Blender
          echo "Central Unity runner configuration: OK"

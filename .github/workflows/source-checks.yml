name: Unity Build Runner Source Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check central runner configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/unity-android.yml").read_text()
          readme = Path("README.md").read_text()

          assert "workflow_dispatch:" in workflow
          assert "secrets.UNITY_LICENSE" in workflow
          assert "inputs.project-repository" in workflow
          assert "game-ci/unity-builder@v6" in workflow
          assert "actions/upload-artifact@v4" in workflow
          assert "PROJECT_REPO_TOKEN" in workflow
          assert "Unity-project-" in readme
          assert not Path("Assets").exists()
          assert not Path("Blender").exists()
          print("Central Unity build runner layout: OK")
          PY

name: Unity Workflow Source Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reusable workflow and example
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/unity-android.yml").read_text()
          example = Path("examples/unity-android-caller.yml").read_text()
          readme = Path("README.md").read_text()

          assert "workflow_call:" in workflow
          assert "game-ci/unity-builder@v6" in workflow
          assert "UNITY_LICENSE" in workflow and "UNITY_EMAIL" in workflow and "UNITY_PASSWORD" in workflow
          assert "workflow_dispatch:" in example
          assert "publish-prerelease: false" in example
          assert "Eclipse-Hollow-Sky-Unity." in readme
          assert not Path("Assets").exists()
          assert not Path("Blender").exists()
          print("Shared workflow layout: OK")
          PY

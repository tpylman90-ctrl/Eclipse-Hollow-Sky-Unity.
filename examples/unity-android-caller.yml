name: Unity Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: tpylman90-ctrl/Eclipse-Hollow-Sky-Unity./.github/workflows/unity-android.yml@main
    permissions:
      contents: read
    with:
      unity-version: 6000.3.27f2
      project-path: .
      build-method: YourNamespace.YourBuildClass.BuildAndroid
      apk-path: build/Android/YourGame.apk
      artifact-name: YourGame-Android-APK
      publish-prerelease: false
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
